<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#eeeae1"><meta property="og:title" content="Build a factory together in Mathine"><meta property="og:description" content="One factory. Four friends. Open your invitation in Mathine."><title>Mathine · Invitation</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eeeae1;color:#243b38;font:16px/1.5 system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:24px}main{max-width:430px;width:100%;text-align:center}header{font-size:38px;font-weight:750;letter-spacing:-2px;color:#245d50}section{background:#faf8f2;border:1px solid #d3dbcf;border-radius:24px;padding:28px;margin-top:24px}h1{font-size:25px;line-height:1.2}p{color:#65766c}.code{font:700 36px/1.6 ui-monospace,monospace;letter-spacing:5px;margin:16px 0;color:#245d50}a,button{display:block;width:100%;border:1px solid #d3dbcf;border-radius:12px;padding:13px;margin:12px 0;color:#245d50;background:transparent;text-decoration:none;font:600 15px system-ui;cursor:pointer}.primary{background:#245d50;color:#fff}small{color:#65766c}a:focus-visible,button:focus-visible{outline:3px solid #bb8348;outline-offset:3px}.stores{display:flex;gap:10px}.stores a{font-size:13px}[hidden]{display:none!important}footer{font-size:12px;margin-top:20px}</style></head>
<body><main><header>mathine</header><section><h1 id="title">A factory is waiting for you.</h1><p id="intro">Open this invitation in Mathine and build together.</p><div id="valid" hidden><div class="code" id="code"></div><a class="primary" id="open">Open in Mathine</a><button id="copy">Copy invitation code</button><p id="status" aria-live="polite"></p><small id="hint">Installing for the first time? Keep the code, then enter it in Together.</small><div class="stores"><a href="https://apps.apple.com/app/id6821986321">App Store</a><a href="https://play.google.com/store/apps/details?id=com.vitpapps.mathine">Google Play</a></div></div><p id="invalid" hidden>This invitation is incomplete. Ask your friend for a new link.</p></section><footer><a href="/mathine/support/">Mathine support</a></footer></main>
<script>
const query=new URLSearchParams(location.search),code=query.get('code')||'',env=query.get('env')||'production';
const valid=/^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$/.test(code)&&['production','staging'].includes(env)&&[...query.keys()].every(k=>['code','env'].includes(k))&&query.getAll('code').length===1&&query.getAll('env').length<=1;
const ro=navigator.language.toLowerCase().startsWith('ro');
if(ro){document.documentElement.lang='ro';for(const [id,text]of Object.entries({title:'O fabrică te așteaptă.',intro:'Deschide invitația în Mathine și construiți împreună.',open:'Deschide în Mathine',copy:'Copiază codul invitației',hint:'Instalezi pentru prima dată? Păstrează codul și introdu-l în Împreună.',invalid:'Invitația este incompletă. Cere-i prietenului un link nou.'}))document.getElementById(id).textContent=text;}
document.getElementById(valid?'valid':'invalid').hidden=false;
if(valid){document.getElementById('code').textContent=code;document.getElementById('open').href='mathine://join?code='+code+(env==='staging'?'&env=staging':'');document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(code);document.getElementById('status').textContent=ro?'Cod copiat.':'Code copied.';}catch{document.getElementById('status').textContent=ro?'Selectează și copiază codul de mai sus.':'Select and copy the code above.';}};}
</script></body></html>
